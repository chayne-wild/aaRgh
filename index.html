<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>aaRgh — Offline R & swirl</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #182026;
      --border: #2a3540;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #38bdf8;
      --cmd: #7ee787;
      --err: #ff7b72;
      --chip-bg: #212c35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .brand {
      font-family: monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .top-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .top-btn {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      font-family: monospace;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .top-btn:active { background: var(--accent); color: #000; }
    .top-btn.plot-ready { border-color: var(--accent); color: var(--accent); }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .line-stdout { white-space: pre-wrap; word-break: break-word; color: var(--text); }
    .line-stderr { white-space: pre-wrap; word-break: break-word; color: var(--err); }
    .line-cmd { white-space: pre-wrap; word-break: break-word; color: var(--cmd); font-weight: 600; }

    /* Continue bar when swirl pauses at ... */
    #continue-bar {
      display: none;
      background: #1d2d3e;
      border-top: 1px solid var(--accent);
      padding: 8px 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
    }

    /* Sticky Bottom Dock: Var Chips + Input + Operator Bar */
    .bottom-dock {
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #var-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .var-chip {
      background: #1f2d3d;
      color: #79c0ff;
      border: 1px solid #30465e;
      border-radius: 999px;
      padding: 3px 10px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .input-row {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      gap: 8px;
    }
    #prompt-label {
      font-family: monospace;
      color: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }
    #r-input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.95rem;
      outline: none;
    }
    #r-input:focus { border-color: var(--accent); }
    #send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Primitive Operator Toggle Bar */
    .op-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      overflow-x: auto;
      background: #12181f;
      border-top: 1px solid var(--border);
    }
    .mode-toggle {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 5px;
      padding: 6px 8px;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .op-key {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      min-width: 32px;
      height: 34px;
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .op-key:active { background: var(--accent); color: #000; }

    /* Pop-Out Plot Modal Window */
    #plot-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-width: 640px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    #plot-canvas {
      width: 100%;
      height: auto;
      background: #fff;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">aaRgh</div>
    <div class="top-actions">
      <button class="top-btn" onclick="sendCommand('play()')">play()</button>
      <button class="top-btn" onclick="sendCommand('nxt()')">nxt()</button>
      <button class="top-btn" onclick="sendCommand('skip()')">skip()</button>
      <button class="top-btn" onclick="sendCommand('main()')">main()</button>
      <button class="top-btn" onclick="sendCommand('swirl()')">swirl()</button>
      <button class="top-btn" id="plot-btn" onclick="togglePlotModal(true)">Plot</button>
    </div>
  </header>

  <div id="transcript">
    <div class="line-stdout" id="boot-status">Initializing offline Base R (webR) & loading swirl courses...</div>
  </div>

  <div id="continue-bar" onclick="sendCommand('')">... Tap here or press Enter to Continue ...</div>

  <div class="bottom-dock">
    <div id="var-chips"></div>
    <div class="input-row">
      <span id="prompt-label">&gt;</span>
      <input
        id="r-input"
        type="text"
        autocapitalize="none"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="text"
        enterkeyhint="send"
        placeholder="Type or swipe R command..."
      />
      <button id="send-btn" onclick="submitInput()">Send</button>
    </div>
    <div class="op-bar" id="op-bar">
      <button class="mode-toggle" id="mode-btn" onmousedown="event.preventDefault(); toggleOpMode()">[R]</button>
      <div id="op-keys-container" style="display:flex; gap:4px;"></div>
    </div>
  </div>

  <div id="plot-modal" onclick="if(event.target===this) togglePlotModal(false)">
    <div class="modal-card">
      <div class="modal-header">
        <span>R Graphics Output</span>
        <button class="top-btn" onclick="togglePlotModal(false)">Close</button>
      </div>
      <canvas id="plot-canvas" width="1008" height="1008"></canvas>
    </div>
  </div>

  <script type="module">
    import { Console } from './webr/webr.mjs';

    const R_KEYS    = ['<', '-', '|', '>', '$', '(', ')', '[', ']', '"', "'", ',', ':', '?', '_'];
    const MATH_KEYS = ['<', '>', '=', '!', '&', '|', '%', '*', '+', '-', '/', '^', '~'];
    let currentMode = 'R';

    const transcript = document.getElementById('transcript');
    const rInput = document.getElementById('r-input');
    const promptLabel = document.getElementById('prompt-label');
    const continueBar = document.getElementById('continue-bar');
    const varChips = document.getElementById('var-chips');
    const plotModal = document.getElementById('plot-modal');
    const plotCanvas = document.getElementById('plot-canvas');
    const plotBtn = document.getElementById('plot-btn');
    let lastBacktickedTokens = new Set();

    // Normalize smart quotes from mobile keyboards
    rInput.addEventListener('input', () => {
      const pos = rInput.selectionStart;
      rInput.value = rInput.value.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
      rInput.setSelectionRange(pos, pos);
    });

    rInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInput();
      }
    });

    function renderOpKeys() {
      const container = document.getElementById('op-keys-container');
      container.innerHTML = '';
      const keys = currentMode === 'R' ? R_KEYS : MATH_KEYS;
      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'op-key';
        btn.textContent = k;
        btn.onmousedown = (e) => {
          e.preventDefault(); // Keep keyboard focused
          insertAtCursor(k);
        };
        container.appendChild(btn);
      });
    }

    window.toggleOpMode = () => {
      currentMode = currentMode === 'R' ? 'Math' : 'R';
      document.getElementById('mode-btn').textContent = `[${currentMode}]`;
      renderOpKeys();
    };

    window.insertAtCursor = (text) => {
      const start = rInput.selectionStart ?? rInput.value.length;
      const end = rInput.selectionEnd ?? rInput.value.length;
      const val = rInput.value;
      rInput.value = val.slice(0, start) + text + val.slice(end);
      const nextPos = start + text.length;
      rInput.setSelectionRange(nextPos, nextPos);
      rInput.focus();
    };

    window.togglePlotModal = (show) => {
      plotModal.style.display = show ? 'flex' : 'none';
    };

    function appendLine(text, cls = 'line-stdout') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;

      // Extract any `identifier` or 'identifier' mentioned in swirl prompts for 1-tap chips
      const matches = text.match(/[`']([a-zA-Z0-9_.]+)[`']/g);
      if (matches) {
        matches.forEach(m => {
          const clean = m.slice(1, -1);
          if (clean.length > 1 && !clean.includes(' ')) lastBacktickedTokens.add(clean);
        });
        renderVarChips();
      }
    }

    function renderVarChips() {
      varChips.innerHTML = '';
      Array.from(lastBacktickedTokens).slice(-12).forEach(token => {
        const chip = document.createElement('button');
        chip.className = 'var-chip';
        chip.textContent = token;
        chip.onmousedown = (e) => {
          e.preventDefault();
          insertAtCursor(token);
        };
        varChips.appendChild(chip);
      });
    }

    renderOpKeys();

    // Initialize webR Console pointing to local ./webr/ folder
    const webRConsole = new Console({
      stdout: (line) => appendLine(line, 'line-stdout'),
      stderr: (line) => appendLine(line, 'line-stderr'),
      prompt: (p) => {
        promptLabel.textContent = p.trim() || '>';
        if (p.trim() === '...') {
          continueBar.style.display = 'block';
        } else {
          continueBar.style.display = 'none';
        }
        transcript.scrollTop = transcript.scrollHeight;
      },
      canvasImage: (img) => {
        const ctx = plotCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        plotBtn.classList.add('plot-ready');
        togglePlotModal(true);
      },
      canvasNewPage: () => {
        const ctx = plotCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, plotCanvas.width, plotCanvas.height);
      }
    }, {
      baseUrl: './webr/'
    });

    window.sendCommand = (cmd) => {
      appendLine(`${promptLabel.textContent} ${cmd}`, 'line-cmd');
      continueBar.style.display = 'none';
      webRConsole.stdin(cmd + '\n');
    };

    window.submitInput = () => {
      const cmd = rInput.value;
      rInput.value = '';
      window.sendCommand(cmd);
    };

    async function bootAaRgh() {
      await webRConsole.webR.init();
      const FS = webRConsole.webR.FS;

      // Create /persist/aargh_bundle inside webR's virtual filesystem
      try { await FS.mkdir('/persist'); } catch (e) {}
      try { await FS.mkdir('/persist/aargh_bundle'); } catch (e) {}

      // Load vfs_manifest.json and populate all swirl + course files into webR VFS
      const manifestResp = await fetch('./vfs_manifest.json');
      const files = await manifestResp.json();

      for (const relPath of files) {
        const parts = relPath.split('/');
        let currentDir = '/persist/aargh_bundle';
        for (let i = 0; i < parts.length - 1; i++) {
          currentDir += '/' + parts[i];
          try { await FS.mkdir(currentDir); } catch (e) {}
        }
        const fileResp = await fetch('./' + relPath);
        const buf = new Uint8Array(await fileResp.arrayBuffer());
        await FS.writeFile('/persist/aargh_bundle/' + relPath, buf);
      }

      // Copy swirl_offline_engine.R into VFS
      const engineResp = await fetch('./swirl_offline_engine.R');
      const engineBuf = new Uint8Array(await engineResp.arrayBuffer());
      await FS.writeFile('/persist/aargh_bundle/swirl_offline_engine.R', engineBuf);

      document.getElementById('boot-status').textContent = 'aaRgh Offline R Engine Ready.';

      // Configure graphics device & load swirl_offline_engine.R, then start swirl()
      await webRConsole.webR.evalRVoid(`
        options(device = webr::canvas)
        .aargh_root <- "/persist/aargh_bundle"
        source("/persist/aargh_bundle/swirl_offline_engine.R")
      `);

      webRConsole.run();
      webRConsole.stdin('swirl()\n');
    }

    bootAaRgh();
  </script>
</body>
</html>
